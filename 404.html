<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vizora.tj</title>
    <script>
      (function () {
        var firstPart = location.pathname.split("/").filter(Boolean)[0] || "";
        var base = firstPart ? "/" + firstPart + "/" : "/";
        sessionStorage.setItem(
          "vizora-spa-redirect",
          location.pathname + location.search + location.hash
        );
        location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
