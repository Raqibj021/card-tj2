<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vizora.tj</title>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem("vizora-spa-redirect", path);
        } catch (_) {
          // The root page is still a safe fallback when browser storage is blocked.
        }
        // vizora.tj is served from the domain root. Redirecting to the first path
        // segment sends /organization/... back to the same 404 forever.
        location.replace(location.origin + "/");
      })();
    </script>
  </head>
  <body></body>
</html>
