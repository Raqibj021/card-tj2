name: Deploy Vizora contact function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/public-contact/**"
      - "supabase/functions/_shared/contact.js"
      - ".github/workflows/deploy-contact-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy public contact function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          supabase functions deploy public-contact \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
