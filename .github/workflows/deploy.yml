name: Deploy VIZORA.TJ to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for vizora.tj
        env:
          VITE_BASE_PATH: /
          VITE_PUBLIC_SITE_URL: https://vizora.tj
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        run: cp deployment/github-pages-404.html dist/404.html

      - name: Add custom domain marker\n        run: echo "vizora.tj" > dist/CNAME\n\n      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: https://vizora.tj
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
