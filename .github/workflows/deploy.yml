name: Deploy VIZORA.TJ to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for vizora.tj
        env:
          VITE_BASE_PATH: /
          VITE_PUBLIC_SITE_URL: https://vizora.tj
        run: npm run build

      - name: Add SPA fallback
        run: cp deployment/github-pages-404.html dist/404.html

      - name: Publish new gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: vizora.tj
